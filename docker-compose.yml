###############################################################################
# Self-built DSH web container.
#
#   cp .env.example .env   # then edit
#   docker compose up -d                     # uses the GHCR image (tracks upstream)
#   docker compose up -d --build             # or build locally from ./Dockerfile
#   docker compose logs -f dsh               # the startup URL is printed once
#
# Keeping DSH current:
#   docker compose pull && docker compose up -d            # one-shot upgrade
#   docker compose --profile auto-update up -d             # upgrade on a timer
#
# Note: `image:` and `build:` are both present on purpose. `up -d` pulls the
# image; `up -d --build` rebuilds from the Dockerfile and tags it with the same
# name. That means a local build silently overrides the CI image on this host --
# pick one workflow and stick to it.
#
# Ports: bound to 127.0.0.1 on the host by default so nothing is exposed until
# you put a reverse proxy in front. Change to "3080:3080" (or add a second
# published port) only after reading the security notes in DEPLOY.md.
###############################################################################

services:
  dsh:
    build:
      context: .
      args:
        # Which @deepseek-ai/dsh to install when building locally. Accepts a
        # concrete version or a dist-tag. `latest` keeps a local build in sync
        # with what CI publishes; set e.g. DSH_VERSION=0.2.1-rc.5 in .env to
        # pin one. Only consulted by `docker compose build` -- the image path
        # does not use it.
        DSH_VERSION: "${DSH_VERSION:-latest}"
        INSTALL_PWSH: "0"           # 1 only if a custom preset re-enables tool-pwsh
        INSTALL_PYTHON: "1"
    # Default: pull the image CI publishes on every upstream release. Run
    # `docker compose pull && docker compose up -d` to upgrade, or enable the
    # `auto-update` profile below to do it on a timer.
    # To build locally instead, comment out `image:` and use
    #   docker compose up -d --build
    image: ${DSH_IMAGE:-ghcr.io/ly921002/dsh-docker:latest}
    container_name: dsh-web
    user: "0:0" 
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

    ports:
      # Keep it on loopback and terminate TLS in a reverse proxy (recommended).
      # Use "3080:3080" only with --public-url + --trusted-host, or better TLS.
      - "127.0.0.1:${DSH_PORT:-3080}:${DSH_PORT:-3080}"

    environment:
      TZ: "${TZ:-Asia/Shanghai}"

      # Persistent state. /data on the host keeps sessions, credentials and
      # settings across image rebuilds.
      DSH_HOME: /data/.dsh
      DSH_AGENTS_HOME: /data/.agents

      # Leave empty -> the entrypoint auto-detects the container's own IP.
      # Never set 0.0.0.0 or :: (DSH rejects wildcard binds).
      DSH_HOST: ""
      DSH_PORT: "3080"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-sk}"
      # Remote access. Set both together when you reach the container through
      # a domain name or a public IP that is NOT the container's own address.
      #   DSH_PUBLIC_URL: "https://dsh.example.com/"
      #   DSH_TRUSTED_HOST: "dsh.example.com"
      DSH_PUBLIC_URL: ""
      DSH_TRUSTED_HOST: ""

      # Optional native TLS inside the container (paths are relative to
      # DSH_WORKSPACE=/workspace). Prefer a reverse proxy instead: DSH has no
      # ACME client and never renews certificates.
      # DSH_TLS_CERT: /workspace/tls/fullchain.pem
      # DSH_TLS_KEY: /workspace/tls/privkey.pem

    volumes:
      # DSH state (sessions, credentials, settings, profile plugins)
      - ./data:/data
      # Default workspace root -- the directory the process runs in
      - ./workspace:/workspace

    # Oracle free-tier VMs can be small; give the LibreOfficeKit WASM engine
    # room to breathe.
    mem_limit: "${DSH_MEM_LIMIT:-2g}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      # Read by the optional watchtower service below. It is the only container
      # it is allowed to touch.
      com.centurylinklabs.watchtower.enable: "true"

  # ---------------------------------------------------------------------------
  # Optional automatic upgrade. Off by default; start it with
  #
  #   docker compose --profile auto-update up -d
  #
  # It polls ghcr.io every AUTO_UPDATE_INTERVAL seconds and, when a newer
  # `latest` digest appears, pulls it and recreates ONLY the dsh container.
  # Your ./data volume (sessions, credentials, plugins) survives the swap.
  #
  # Caveat worth knowing before enabling: a recreate kills running agent
  # sessions. Anything still streaming when the image lands is lost. If that
  # matters, leave the profile off and upgrade by hand at a quiet moment.
  # ---------------------------------------------------------------------------
  auto-update:
    image: containrrr/watchtower:latest
    container_name: dsh-auto-update
    profiles: ["auto-update"]
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only containers carrying the watchtower.enable label (i.e. dsh) are
      # considered, so this never restarts anything else on the host.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "false"
      WATCHTOWER_TIMEOUT: 30s
    command: --interval ${AUTO_UPDATE_INTERVAL:-3600}

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
