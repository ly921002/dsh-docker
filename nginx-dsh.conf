###############################################################################
# Nginx reverse proxy for the self-built DSH web container.
#
# Install:
#   sudo cp nginx-dsh.conf /etc/nginx/sites-available/dsh
#   sudo ln -s /etc/nginx/sites-available/dsh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificates (either works):
#   sudo certbot --nginx -d dsh.example.com
#   ...or mount an Oracle/Let's Encrypt chain into /etc/nginx/tls/
#
# The requirements encoded below come straight from DSH's own public-deployment
# doc: preserve the browser-visible Host, strip the mount prefix, forward
# Upgrade/Connection, rewrite the cookie Path to the mount, and redirect /ui
# to /ui/ (only /ui/ exchanges the startup token for a session cookie).
###############################################################################

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Drop the mount prefix when proxying, and remember what it was.
map $request_uri $dsh_prefix {
    default                     "";
    "~^/ui(/|$)"                "/ui";
    "~^/dsh(/|$)"               "/dsh";   # alternative prefix if you prefer
}

upstream dsh_web {
    server 127.0.0.1:3080;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dsh.example.com;          # <-- change

    # --- TLS -----------------------------------------------------------------
    # ssl_certificate     /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;

    # DSH session cookies: keep them off JS.
    proxy_cookie_flags ~ secure httponly samesite=lax;

    # --- Reverse proxy -------------------------------------------------------
    # Mount prefix in this example is /ui. Change both the location and the
    # map entries above if you want something else (or serve from / directly).
    location /ui/ {
        proxy_pass         http://dsh_web/;
        proxy_http_version 1.1;

        # The Host fence compares against the authority the browser sees, so
        # this MUST stay $host -- never rewrite it to the upstream name.
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;

        # Long-lived sessions: don't buffer, don't time out mid-turn.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Streaming / hot-module-reload support.
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    # Only /ui/ exchanges the startup token for a session cookie.
    location = /ui {
        return 301 /ui/;
    }

    # Keep the container itself unreachable from outside.
    location / {
        return 404;
    }
}

# Optional: force HTTPS. DSH adds `Secure` to session cookies on TLS listeners,
# so the browser-facing leg should stay HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name dsh.example.com;          # <-- change
    return 301 https://$host$request_uri;
}
